<style>
body{margin:0;background:#0B0D11;font-family:'Inter',system-ui,sans-serif;color:#E6E8EC}
.hd{display:grid;grid-template-columns:150px 230px 1fr 140px;gap:20px;padding:0 20px;height:38px;align-items:center;font-size:11px;font-weight:600;letter-spacing:1px;color:#8A93A3;border-bottom:1px solid #232832}
.rw{display:grid;grid-template-columns:150px 230px 1fr 140px;gap:20px;padding:11px 20px;border-bottom:1px solid #1B2029;font-size:13px;line-height:1.5;align-items:start}
.rw:nth-child(even){background:#101319}
.ar{font-weight:600;font-size:12px;color:#8FA8FF}
.ct{font-weight:500;color:#fff}
.ds{color:#B4BBC8}
.sk{font-size:11.5px;color:#8A93A3;font-family:'JetBrains Mono',monospace}
</style>

<div style="width:1440px;height:1800px;box-sizing:border-box;padding:40px 48px;background:#0B0D11;display:flex;flex-direction:column;gap:24px;overflow:hidden">
<div>
<div style="font-size:24px;font-weight:600">Button &amp; behavior spec</div>
<div style="font-size:13px;color:#8A93A3;margin-top:6px;max-width:900px;line-height:1.55">What every control does. Disabled controls are greyed and show a tooltip that says why. Destructive actions always ask first. Screens are on the other artboards.</div>
</div>
<div style="background:#12151B;border:1px solid #232832;border-radius:14px;overflow:hidden">
<div class="hd"><span>AREA</span><span>CONTROL</span><span>WHAT IT DOES</span><span>SHORTCUT</span></div>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="10">
<div class="rw"><span class="ar">{{ r.area }}</span><span class="ct">{{ r.control }}</span><span class="ds">{{ r.action }}</span><span class="sk">{{ r.key }}</span></div>
</sc-for>
</div>
</div>

<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:1800}}">
class Component extends DCLogic {
  renderVals() {
    const d = [
      ['Top bar','Connection button','Opens the database switcher: databases on this server, other saved connections, Manage connections, New connection. Choosing a database changes the active DB for the current tab.',''],
      ['Top bar','Search','Opens the command palette. Searches tables, saved queries, history and commands. Enter opens the first match.','Ctrl K'],
      ['Top bar','Connect (when disconnected)','Opens the Connections dialog. Replaces Disconnect while there is no connection.','Ctrl N'],
      ['Top bar','Disconnect','Closes the connection. If a query is running it asks first. The explorer goes back to the empty state and Run is disabled.',''],
      ['Top bar','Settings','Opens Settings (General, Editor, Results, Updates, Shortcuts, About).','Ctrl ,'],
      ['Rail','Explorer','Shows tables, views and procedures of the active database.','Ctrl Shift E'],
      ['Rail','Saved queries','Shows saved queries in folders. Double-click opens one in a new tab.','Ctrl Shift S'],
      ['Rail','History','Shows executed queries for 30 days. Hover for Run again, Open in tab, Save.','Ctrl Shift H'],
      ['Rail','Schema diagram','Opens the diagram in a tab. Disabled while disconnected.','Ctrl Shift D'],
      ['Rail','Terminal','Shows or hides the Terminal tab in the results panel.','Ctrl `'],
      ['Explorer','Refresh','Reloads tables, views and procedures from the server.','F5'],
      ['Explorer','Filter field','Filters as you type. Use * as a wildcard. Esc clears.','Ctrl F'],
      ['Explorer','Tables / Views / Procs','Switches the object type shown in the list.',''],
      ['Explorer','Table row','Click selects. Double-click runs SELECT TOP 100 in a new tab. Right-click opens the context menu.','Enter'],
      ['Tabs','Query tab','Click switches. The × closes it. A blue dot means unsaved. Drafts are kept automatically, so closing never loses text.','Ctrl W'],
      ['Tabs','New tab (+)','Opens an empty query bound to the active database.','Ctrl T'],
      ['Editor','Run','Runs the selection, or the whole script when nothing is selected. While running it becomes a red Stop button.','F5 · Shift F5 stops'],
      ['Editor','Format','Formats the SQL in the tab. Applies to the selection if there is one.','Ctrl Shift F'],
      ['Editor','Explain plan','Shows the estimated execution plan in the results panel without running the query.','Ctrl L'],
      ['Editor','Save','Saves into Saved queries. Asks for a name and folder the first time.','Ctrl S'],
      ['Editor','Limit','Menu: 100, 500, 1000, No limit. Adds TOP only when the query has none.',''],
      ['Results','Results / Messages / Terminal','Switches the bottom panel. Messages shows a red count when the last run had an error.',''],
      ['Results','Filter rows','Filters the loaded rows on the client. It does not re-run the query.','Ctrl F in grid'],
      ['Results','Hide deleted','Hides rows where IsDeleted is true. Only shown when the table has that column.',''],
      ['Results','Columns','Show, hide and reorder columns. Remembered per table.',''],
      ['Results','PK chip','Lists primary key columns. Click copies them.',''],
      ['Results','Refresh','Re-runs the last query with the same limit.','Ctrl R'],
      ['Results','Edit cell','Opens Edit cell for the selected cell and previews the UPDATE. Disabled when the table has no primary key or nothing is selected.','F2'],
      ['Results','Delete','Opens the delete confirmation for the selected rows with the DELETE preview. Disabled when no rows are selected.','Del'],
      ['Results','Export','Menu: CSV, JSON, Excel, SQL INSERTs, Markdown. Rows: current results or selected.','Ctrl E'],
      ['Grid','Cell','Click selects. Shift-click selects a range. Ctrl-click on a blue FK value opens the referenced row in a new tab.','Ctrl C copies'],
      ['Status bar','Update button (bottom-left)','Shown only when a newer version exists. Opens the update modal. Becomes "Downloading 42%", then "Restart to update". Hidden when up to date.',''],
      ['Status bar','Connection status','Click opens the database switcher.',''],
      ['Status bar','Ln / Col','Click opens Go to line.','Ctrl G'],
      ['Status bar','Encoding','Menu to reopen or save the file with another encoding.',''],
      ['Update modal','Update now','Starts the download and switches to the progress view.',''],
      ['Update modal','Later','Closes the modal. It opens again on the next launch. The bottom-left button stays.','Esc'],
      ['Update modal','Skip this version','Stops the automatic popup for this version only. The bottom-left button stays.',''],
      ['Update modal','Run in background','Closes the progress view. The bottom-left button shows the percentage.',''],
      ['Update modal','Restart now','Saves drafts, closes the app, installs, then reopens tabs and reconnects. Warns if a query is running.',''],
      ['Connections','Test connection','Tries to connect with the form values and shows the time or the error. Nothing is saved.',''],
      ['Connections','Save &amp; connect','Saves the connection (password goes to the system keychain) and opens it.','Enter'],
      ['Connections','Environment','Dev, Staging or Production. Production shows a red bar and requires typing DELETE to delete rows.','']
    ];
    const rows = d.map(([area, control, action, key]) => ({ area, control, action: action.replace('&amp;','&'), key }));
    rows.forEach(r => { r.control = r.control.replace('&amp;','&'); });
    return { rows };
  }
}
</script>


</body></html>

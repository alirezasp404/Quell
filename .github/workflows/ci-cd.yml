name: CI/CD - Build & Package Cross-Platform Installers

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release version tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # 1. VERIFY & TEST SUITE (Runs on all pushes, PRs, and tags)
  # ---------------------------------------------------------------------------
  verify:
    name: Run Verification & Integrity Suite
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore Quell.csproj

      - name: Build Project
        run: dotnet build Quell.csproj --configuration Release --no-restore

      - name: Execute Verification Suite (--verify)
        run: dotnet run --configuration Release --no-build -- --verify

  # ---------------------------------------------------------------------------
  # 2. RESOLVE VERSION METADATA (Determines if release packaging should run)
  # ---------------------------------------------------------------------------
  version:
    name: Determine Build Version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.get_version.outputs.tag }}
      version: ${{ steps.get_version.outputs.version }}
      should_release: ${{ steps.get_version.outputs.should_release }}
      is_prerelease: ${{ steps.get_version.outputs.is_prerelease }}
    steps:
      - name: Resolve Version
        id: get_version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            INPUT_TAG="${{ github.event.inputs.tag }}"
            if [[ -z "$INPUT_TAG" ]]; then INPUT_TAG="v1.0.0"; fi
            if [[ "$INPUT_TAG" != v* ]]; then
              TAG_NAME="v$INPUT_TAG"
              CLEAN_VER="$INPUT_TAG"
            else
              TAG_NAME="$INPUT_TAG"
              CLEAN_VER="${INPUT_TAG#v}"
            fi
            echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"
            echo "version=$CLEAN_VER" >> "$GITHUB_OUTPUT"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            if [[ "$CLEAN_VER" == *-* ]]; then
              echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            else
              echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            fi
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            CLEAN_VER="${TAG_NAME#v}"
            echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"
            echo "version=$CLEAN_VER" >> "$GITHUB_OUTPUT"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            if [[ "$CLEAN_VER" == *-* ]]; then
              echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            else
              echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "version=1.0.0" >> "$GITHUB_OUTPUT"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------------
  # 3. WINDOWS BUILD & INSTALLER PACKAGING (Only runs for version tags)
  # ---------------------------------------------------------------------------
  build-windows:
    name: Build Windows Installer & Portable Package
    needs: [verify, version]
    if: needs.version.outputs.should_release == 'true'
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG_NAME: ${{ needs.version.outputs.tag }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Windows Standalone Executable (win-x64)
        run: >
          dotnet publish Quell.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:Version=${{ env.VERSION }}
          -p:AssemblyVersion=${{ env.VERSION }}.0
          -p:FileVersion=${{ env.VERSION }}.0
          -p:InformationalVersion=${{ env.VERSION }}
          -o ./publish/win-x64

      - name: Prepare Windows Distribution Directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path ./dist/windows

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Compile Inno Setup Installer (.exe)
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\iscc.exe" /Q /DMyAppVersion="${{ env.VERSION }}" /DOutputBaseFilename="Quell-Setup-${{ env.VERSION }}-win-x64" "packaging\windows\installer.iss"
          Copy-Item "./dist/windows/Quell-Setup-${{ env.VERSION }}-win-x64.exe" -Destination "./dist/windows/Quell-Setup-win-x64.exe" -Force

      - name: Create Portable Zip Package
        shell: pwsh
        run: |
          Compress-Archive -Path ./publish/win-x64/* -DestinationPath "./dist/windows/Quell-${{ env.VERSION }}-win-x64-portable.zip" -Force

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: dist/windows/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 4. LINUX BUILD & DEBIAN/UBUNTU INSTALLER PACKAGING (Only runs for version tags)
  # ---------------------------------------------------------------------------
  build-linux:
    name: Build Linux (.deb Installer & Portable .tar.gz)
    needs: [verify, version]
    if: needs.version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG_NAME: ${{ needs.version.outputs.tag }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Linux Standalone Executable (linux-x64)
        run: >
          dotnet publish Quell.csproj
          -c Release
          -r linux-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:Version=${{ env.VERSION }}
          -p:AssemblyVersion=${{ env.VERSION }}.0
          -p:FileVersion=${{ env.VERSION }}.0
          -p:InformationalVersion=${{ env.VERSION }}
          -o ./publish/linux-x64

      - name: Package Debian Installer (.deb)
        run: |
          chmod +x packaging/linux/build-deb.sh
          ./packaging/linux/build-deb.sh ${{ env.VERSION }} ./publish/linux-x64 ./dist/linux

      - name: Create Portable .tar.gz Package
        run: |
          mkdir -p dist/linux
          tar -czvf "dist/linux/Quell-${{ env.VERSION }}-linux-x64-portable.tar.gz" -C publish/linux-x64 .

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: dist/linux/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 5. MACOS BUILD & INSTALLER (.dmg & .zip) PACKAGING (Only runs for version tags)
  # ---------------------------------------------------------------------------
  build-macos:
    name: Build macOS (${{ matrix.rid }})
    needs: [verify, version]
    if: needs.version.outputs.should_release == 'true'
    runs-on: macos-latest
    strategy:
      matrix:
        rid: [osx-x64, osx-arm64]
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG_NAME: ${{ needs.version.outputs.tag }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish macOS App Binaries (${{ matrix.rid }})
        run: >
          dotnet publish Quell.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:Version=${{ env.VERSION }}
          -p:AssemblyVersion=${{ env.VERSION }}.0
          -p:FileVersion=${{ env.VERSION }}.0
          -p:InformationalVersion=${{ env.VERSION }}
          -o ./publish/${{ matrix.rid }}

      - name: Package macOS .app Bundle and .dmg Installer
        run: |
          mkdir -p ./dist/macos
          chmod +x packaging/macos/build-app.sh
          ./packaging/macos/build-app.sh ${{ matrix.rid }} ${{ env.VERSION }} ./publish/${{ matrix.rid }} ./dist/macos

      - name: Upload macOS Artifacts (${{ matrix.rid }})
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.rid }}-packages
          path: dist/macos/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 6. AUTOMATED GITHUB RELEASE (Only triggers on version tags)
  # ---------------------------------------------------------------------------
  release:
    name: Publish Release Packages
    needs: [build-windows, build-linux, build-macos, version]
    if: needs.version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Release Staging Directory
        run: mkdir -p ./release-assets

      - name: Download Windows Packages
        uses: actions/download-artifact@v4
        with:
          name: windows-packages
          path: ./release-assets

      - name: Download Linux Packages
        uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: ./release-assets

      - name: Download macOS x64 Packages
        uses: actions/download-artifact@v4
        with:
          name: macos-osx-x64-packages
          path: ./release-assets

      - name: Download macOS ARM64 Packages
        uses: actions/download-artifact@v4
        with:
          name: macos-osx-arm64-packages
          path: ./release-assets

      - name: Display Release Assets
        run: ls -lh ./release-assets

      - name: Publish or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Quell ${{ needs.version.outputs.tag }}
          draft: false
          prerelease: ${{ needs.version.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
          files: ./release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
